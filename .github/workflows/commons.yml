name: Scarica foto da Wikimedia Commons
on:
  workflow_dispatch:
    inputs:
      ricerca:
        description: Testo da cercare su Commons
        required: true
      cartella:
        description: Cartella in static/img
        required: true
      max:
        description: Numero massimo di foto
        default: "12"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_commons.py "${{ inputs.ricerca }}" "${{ inputs.cartella }}" "${{ inputs.max }}"
      - name: Salva nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img
          git diff --cached --quiet || git commit -m "Foto da Wikimedia Commons: ${{ inputs.ricerca }}"
          git push
